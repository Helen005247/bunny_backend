name: Hermit Proactive Check

on:
  workflow_dispatch:

schedule:
  - cron: "7,37 * * * *"

jobs:
  proactive-check:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger type
        run: |
          echo "Trigger type = ${{ github.event_name }}"
          echo "Schedule = ${{ github.event.schedule }}"

      - name: Check whether Xingxing should send a message
        run: |
          curl -sS --fail-with-body \
            --max-time 120 \
            -X POST \
            "https://bunny-backend-19g1.onrender.com/api/proactive-check" \
            -H "x-proactive-secret: ${{ secrets.PROACTIVE_CRON_SECRET }}"
