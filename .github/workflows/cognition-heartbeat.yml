name: Hermit Cognition Heartbeat
# Distinguishes scheduled, upstream-completed, and manual checks in Actions UI.
run-name: Cognition heartbeat (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    # 正式运行：每3小时检查一次（UTC）
    - cron: '23 */3 * * *'

  # 现有主动检查完成后，也触发 Cognition
  workflow_run:
    workflows: ['Hermit Proactive Check']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hermit-cognition-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    # Only trust successful default-branch runs of the existing workflow.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Log trigger (non-sensitive)
        run: echo "[cognition] trigger=${GITHUB_EVENT_NAME}; utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cognition Wake Gate
        env:
          COGNITION_ENDPOINT: https://bunny-backend-19g1.onrender.com/internal/cognition/tick
          COGNITION_USER_ID: ${{ secrets.COGNITION_USER_ID }}
          COGNITION_TICK_SECRET: ${{ secrets.COGNITION_TICK_SECRET }}
        run: node scripts/cognition-heartbeat.js
