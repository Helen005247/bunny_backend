name: Hermit Diary Review
run-name: Diary review (${{ github.event_name }})

on:
  schedule:
    # Once daily, UTC. User-local previous day is derived by the backend.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional backfill first day, YYYY-MM-DD (leave both blank for daily)'
        required: false
        type: string
      end_date:
        description: 'Optional backfill last day, YYYY-MM-DD (inclusive, max 4 days)'
        required: false
        type: string
      topic_hint:
        description: 'Optional diary theme, e.g. birthday; never a substitute for messages'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hermit-diary-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review diary or backfill chosen days
        env:
          DIARY_ENDPOINT: https://bunny-backend-19g1.onrender.com/internal/diary/tick
          COGNITION_USER_ID: ${{ secrets.COGNITION_USER_ID }}
          COGNITION_TICK_SECRET: ${{ secrets.COGNITION_TICK_SECRET }}
          DIARY_START_DATE: ${{ inputs.start_date }}
          DIARY_END_DATE: ${{ inputs.end_date }}
          DIARY_TOPIC_HINT: ${{ inputs.topic_hint }}
        run: node scripts/diary-review.js
