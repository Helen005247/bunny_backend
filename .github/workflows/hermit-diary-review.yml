name: Hermit Diary Review
# Mark external daily runs with a date so the scheduler can safely detect them.
# Manual preview/live/commit runs retain their own mode in the display title.
run-name: ${{ inputs.dispatch_date != '' && format('Diary daily {0}', inputs.dispatch_date) || format('Diary review ({0}:{1})', github.event_name, inputs.acceptance_mode || 'off') }}

on:
  workflow_dispatch:
    inputs:
      dispatch_date:
        description: 'For external daily scheduler only; leave blank for manual runs'
        required: false
        type: string
      acceptance_mode:
        description: 'off=normal | preview=save V2 plan | verify=read/search/probes | live=write V2 | commit=confirm saved plan | probe=old rollback probe'
        required: false
        # Keep this quoted: unquoted YAML 'off' may be parsed as boolean false.
        default: 'off'
        type: choice
        options:
          - 'off'
          - preview
          - verify
          - live
          - commit
          - probe
      start_date:
        description: 'Historical start date for preview/live, YYYY-MM-DD; off uses legacy backfill'
        required: false
        type: string
      end_date:
        description: 'Historical end date for preview/live, YYYY-MM-DD (max 4 days)'
        required: false
        type: string
      topic_hint:
        description: 'Optional historical clue in preview/live; REQUIRED search keyword in verify'
        required: false
        type: string
      plan_id:
        description: 'Only for commit: UUID from saved preview result'
        required: false
        type: string
      plan_digest:
        description: 'Only for commit: full 64-character plan fingerprint from preview result'
        required: false
        type: string
      confirm_write:
        description: 'Only for commit: type WRITE to confirm permanent diary change'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hermit-diary-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review diary (bounded auto-resume) or verify V2
        env:
          DIARY_ENDPOINT: https://bunny-backend-19g1.onrender.com/internal/diary/tick
          COGNITION_USER_ID: ${{ secrets.COGNITION_USER_ID }}
          COGNITION_TICK_SECRET: ${{ secrets.COGNITION_TICK_SECRET }}
          DIARY_ACCEPTANCE_MODE: ${{ inputs.acceptance_mode }}
          DIARY_START_DATE: ${{ inputs.start_date }}
          DIARY_END_DATE: ${{ inputs.end_date }}
          DIARY_TOPIC_HINT: ${{ inputs.topic_hint }}
          DIARY_PLAN_ID: ${{ inputs.plan_id }}
          DIARY_PLAN_DIGEST: ${{ inputs.plan_digest }}
          DIARY_CONFIRM_WRITE: ${{ inputs.confirm_write }}
        run: node scripts/diary-review.js
